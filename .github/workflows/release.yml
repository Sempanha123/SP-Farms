name: Release Automation

"on":
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release Artifacts
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Build Python Wheels and Source Distribution
        run: |
          python -m build

      - name: Build Windows Standalone Executable
        env:
          SP_FARMS_CERT_PATH: ${{ secrets.SP_FARMS_CERT_PATH }}
          SP_FARMS_CERT_PASSWORD: ${{ secrets.SP_FARMS_CERT_PASSWORD }}
          SP_FARMS_TIMESTAMP_URL: ${{ secrets.SP_FARMS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          python scripts/build_windows_dist.py

      - name: Compress Standalone Binary Directory
        shell: pwsh
        run: |
          $Version = "${{ github.ref_name }}"
          Compress-Archive -Path "dist\SP-Farms" -DestinationPath "dist\SP-Farms-$Version-win64.zip" -Force
          Write-Host "Created release archive dist\SP-Farms-$Version-win64.zip"

      - name: Compile Inno Setup Installer (if ISCC available)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc packaging_windows\installer.iss
          } else {
            Write-Host "Inno Setup compiler not found on runner; skipping installer compilation"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/installer/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
